# Builds, tests and deploys the site to Cloudflare on every push to main.
# One-time setup: in the GitHub repo, Settings > Secrets and variables > Actions, add
#   CLOUDFLARE_API_TOKEN  (a token with the "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID (your Cloudflare account id)
# Database changes in migrations/ are still applied by hand (see README).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
