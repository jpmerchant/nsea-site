<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NSEA Swim — Weekly Practice Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--teal:#008675;--teal-dark:#006A5C;--coral:#ee492f;--coral-light:#FCE7E3;--gray:#676d70;--gray-light:#9BA0A3;--line:#E4E7E8;--ink:#1B2325;--panel:#FAFBFB}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);line-height:1.4;padding:4px}
  h2{font:600 22px 'Oswald',sans-serif;color:var(--teal-dark);margin:0 0 4px;text-transform:uppercase;letter-spacing:.5px}
  p{margin:0 0 10px;font-size:13px;color:var(--gray)}
  .wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
  th,td{border:1px solid var(--line);padding:6px 6px;text-align:center;white-space:nowrap}
  thead th{background:var(--teal);color:#fff;font:600 12px 'Oswald',sans-serif;letter-spacing:.4px;text-transform:uppercase}
  thead th span{display:block;font:400 12px 'Inter',sans-serif;text-transform:none}
  tbody th{text-align:left;background:var(--panel)}
  tr.grp th{background:#E6F4F1;color:var(--teal-dark);font:600 13px 'Oswald',sans-serif;letter-spacing:.4px;text-transform:uppercase}
  td.off{color:var(--gray-light)}
  td.changed{background:var(--coral-light);color:#a02a17;font-weight:600}
  td small{display:block;font-weight:400;font-size:11px;color:var(--gray)}
  .err{color:#a02a17}
</style>
</head>
<body>
<!-- Weekly practice table for the newsletter (and anywhere else). ?start=YYYY-MM-DD picks the week (default: next week). -->
<div id="w"><p>Loading…</p></div>
<script>
(function () {
  var q = new URLSearchParams(location.search), root = document.getElementById('w');
  function next() { var d = new Date(); var day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day + 7); return d.toISOString().slice(0, 10); }
  var start = /^\d{4}-\d{2}-\d{2}$/.test(q.get('start') || '') ? q.get('start') : next();
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  fetch('/api/content/schedule?weeks=1&start=' + start).then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (d) {
    var w = d.weeks[0];
    root.replaceChildren(el('h2', null, 'Weekly Schedule'), el('p', null, w.days[0].short + ' – ' + w.days[6].short + (w.season ? ' · ' + w.season : '') + '. Shaded times are changes. Captyn messages always have the latest.'));
    var t = el('table'), h = el('thead'), tr = el('tr');
    tr.appendChild(el('th', null, ''));
    w.days.forEach(function (x) { var th = el('th', null, x.label); th.appendChild(el('span', null, (+x.date.slice(5, 7)) + '/' + (+x.date.slice(8, 10)))); tr.appendChild(th); });
    h.appendChild(tr); t.appendChild(h);
    var b = el('tbody'), last = '';
    w.rows.forEach(function (r) {
      if (r.group !== last) { var g = el('tr', 'grp'), gh = el('th', null, r.group); gh.colSpan = 8; g.appendChild(gh); b.appendChild(g); last = r.group; }
      var row = el('tr'); row.appendChild(el('th', null, r.session));
      r.cells.forEach(function (c) { var td = el('td', c.changed ? 'changed' : (c.text === 'Off' ? 'off' : ''), c.text); if (c.note) td.appendChild(el('small', null, c.note)); row.appendChild(td); });
      b.appendChild(row);
    });
    t.appendChild(b);
    var wrap = el('div', 'wrap'); wrap.appendChild(t); root.appendChild(wrap);
  }).catch(function () { root.replaceChildren(el('p', 'err', 'The schedule could not be loaded. See Captyn for this week’s practices.')); });
})();
</script>
</body>
</html>
